<!doctype html>
<html lang="fr" id="html">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulateur de cadenas</title>
<style>
:root{
  --bg:#f6f5f2; --panel:#ffffff; --ink:#1d1d1f; --muted:#6b6b70; --line:#e2e0da;
  --accent:#2f6fde; --accent-soft:#e3ecfc; --ok:#1f9d55; --ok-soft:#dcf3e5;
  --bad:#d64545; --bad-soft:#fbe3e3; --metal:#c9ccd2; --metal-dark:#8e939c; --wheel:#2b2d31; --wheel-ink:#f4f4f4;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141416; --panel:#1e1f22; --ink:#ececee; --muted:#9a9aa2; --line:#33343a;
    --accent:#6b9cff; --accent-soft:#22304d; --ok:#4cc985; --ok-soft:#1b3527;
    --bad:#ff7070; --bad-soft:#3d2022; --metal:#8b9099; --metal-dark:#5b6068; --wheel:#0d0e10; --wheel-ink:#f4f4f4;
  }
}
:root[data-theme="dark"]{
  --bg:#141416; --panel:#1e1f22; --ink:#ececee; --muted:#9a9aa2; --line:#33343a;
  --accent:#6b9cff; --accent-soft:#22304d; --ok:#4cc985; --ok-soft:#1b3527;
  --bad:#ff7070; --bad-soft:#3d2022; --metal:#8b9099; --metal-dark:#5b6068; --wheel:#0d0e10; --wheel-ink:#f4f4f4;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.6rem;margin:0 0 4px}
.lead{color:var(--muted);margin:0 0 20px;max-width:780px}
.layout{display:grid;grid-template-columns:320px 1fr;gap:18px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h2{font-size:1rem;margin:0 0 10px}
.card h3{font-size:.85rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:16px 0 8px}
.card h3:first-of-type{margin-top:0}
label{display:block;font-size:.88rem;margin:8px 0 3px;color:var(--muted)}
select,input[type=number]{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input[type=range]{width:100%}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
button{font:inherit;padding:8px 13px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:hover{filter:brightness(1.05)}
.hint{font-size:.8rem;color:var(--muted);margin-top:4px}
.main{display:grid;gap:18px;min-width:0}

/* Lock */
.lockzone{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0 4px}
.shackle{width:58%;max-width:300px;height:90px;border:18px solid var(--metal);border-bottom:none;border-radius:120px 120px 0 0;margin-bottom:-4px;transition:transform .35s}
.shackle.open{transform:translateY(-26px)}
.body{background:linear-gradient(180deg,var(--metal),var(--metal-dark));border-radius:18px;padding:18px 18px 14px;display:flex;gap:10px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.wheel{width:56px;height:118px;background:var(--wheel);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;position:relative;box-shadow:inset 0 10px 14px rgba(0,0,0,.6),inset 0 -10px 14px rgba(0,0,0,.6)}
.wheel span{color:var(--wheel-ink);font:700 1.1rem ui-monospace,Consolas,monospace;opacity:.3;line-height:1.5}
.wheel span.cur{font-size:2rem;opacity:1;line-height:1.3}
.wheel.bump span.cur{animation:roll .35s ease}
@keyframes roll{from{transform:translateY(-30px);opacity:0}to{transform:none;opacity:1}}
@media (max-width:480px){.wheel{height:100px}.body{padding:14px 12px}}
.lockzone{container-type:inline-size}
.body{gap:min(10px,calc(48px / var(--n,4)));max-width:100%}
.wheel{width:min(56px,calc((100cqw - 40px) / var(--n,4) - min(10px,calc(48px / var(--n,4)))))}
.wheel span{font-size:min(1.1rem,calc((100cqw - 40px) / var(--n,4) * .36))}
.wheel span.cur{font-size:min(2rem,calc((100cqw - 40px) / var(--n,4) * .6))}
.many .body{padding:12px 10px}
.many .wheel{height:74px;border-radius:7px}
.many .wheel span:not(.cur){display:none}
.many .wheel span.cur{font-size:min(2rem,calc((100cqw - 40px) / var(--n,4) * .85))}
.daylabel{font-size:.9rem;color:var(--muted)}

.alert{margin-top:10px;padding:9px 12px;border-radius:9px;font-size:.9rem;display:none}
.alert.show{display:block}
.alert.bad{background:var(--bad-soft);color:var(--bad)}
.alert.info{background:var(--accent-soft);color:var(--accent)}
.alert.ok{background:var(--ok-soft);color:var(--ok)}

.freq{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
.fw h4{margin:0 0 6px;font-size:.85rem;color:var(--muted);font-weight:600}
.bars{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;align-items:end;height:80px;border-bottom:1px solid var(--line)}
.bar{background:var(--accent);opacity:.75;border-radius:4px 4px 0 0;min-height:1px}
.bars.code .bar{background:var(--ok);opacity:.85}
.rowlbl{font-size:.72rem;color:var(--muted);margin:8px 0 2px}
.blabels,.bpct{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;text-align:center}
.blabels span{font:600 .85rem ui-monospace,Consolas,monospace;color:var(--muted);border-radius:5px;margin-top:3px;border:2px solid transparent}
.blabels span.best{background:var(--accent-soft);color:var(--accent)}
.blabels span.truth{border-color:var(--ok)}
.bpct span{font-size:.62rem;color:var(--muted);font-variant-numeric:tabular-nums}
.duo{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;height:120px;border-bottom:1px solid var(--line);
  background:linear-gradient(to top,transparent calc(50% - .5px),var(--line) calc(50% - .5px),var(--line) calc(50% + .5px),transparent calc(50% + .5px))}
.duo .col{position:relative;height:100%}
.duo i{position:absolute;bottom:0;border-radius:3px 3px 0 0}
.duo i.b{left:0;right:0;background:var(--accent);opacity:.45}
.duo i.g{left:0;right:0;background:var(--ok);opacity:.8}
.bpct.blue span{color:var(--accent)}
.bpct.green span{color:var(--ok);font-weight:600}
.est{font-size:.82rem;margin-top:6px;color:var(--muted)}
.est b{color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.8rem;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:5px}

.truecode{font-size:.95rem;color:var(--muted)}
.truecode b{font:700 1.25rem ui-monospace,Consolas,monospace;letter-spacing:.12em;color:var(--ink)}
.truecode.on b{color:var(--ok)}
.rank{display:grid;gap:4px}
.rrow{display:grid;grid-template-columns:26px var(--cw) 1fr 54px;column-gap:10px;align-items:center;padding:6px 8px;border-radius:8px}
.rn{color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}
.rc{font:700 1.05rem ui-monospace,Consolas,monospace}
.rbar{height:10px;background:var(--bg);border-radius:5px;overflow:hidden}
.rbar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.rp{text-align:right;font-size:.85rem;font-variant-numeric:tabular-nums}
.rl{grid-column:2 / -1;font-size:.74rem;color:var(--muted)}
.rrow.truth{background:var(--ok-soft)}
.rrow.truth .rbar i{background:var(--ok)}
.rrow.truth .rc{color:var(--ok)}
.tag{background:var(--ok);color:#fff;border-radius:4px;padding:0 5px;font-size:.66rem;letter-spacing:.04em}
details.backstage{margin-top:18px;border:1px dashed var(--line);border-radius:10px;padding:8px 12px}
details.backstage summary{cursor:pointer;font-size:.85rem;color:var(--muted);font-weight:600}
canvas{width:100%;display:block}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.langs{display:flex;flex-shrink:0;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-top:4px}
.langs button{border:0;border-radius:0;padding:5px 10px;font-size:.85rem;background:var(--panel)}
.langs button.on{background:var(--accent);color:#fff}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1 data-i18n="title"></h1>
    <div class="langs" role="group" aria-label="Langue / Language">
      <button data-lang="fr">FR</button><button data-lang="en">EN</button>
    </div>
  </div>
  <p class="lead" data-i18n="lead"></p>

  <div class="layout">
    <!-- Controls -->
    <div class="card">
      <div class="btns" style="margin-top:0">
        <button class="primary" id="auto" style="flex:1 1 100%;font-size:1.05rem;padding:11px"></button>
        <button id="reveal" style="flex:1"></button>
        <button id="reset" style="flex:1" data-i18n="newCode"></button>
      </div>
      <label for="speed"><span data-i18n="speed"></span> <b id="speedv"></b></label>
      <input id="speed" type="range" min="1" max="10" value="4">

      <label for="n" style="margin-top:14px" data-i18n="digits"></label>
      <select id="n"><option>3</option><option selected>4</option><option>5</option><option>6</option><option>8</option><option>10</option><option>12</option></select>

      <details class="backstage" id="backstage">
        <summary data-i18n="backstage"></summary>
        <label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" id="mystery" checked> <span data-i18n="mystery"></span></label>
        <label for="rdir" data-i18n="rdir"></label>
        <select id="rdir">
          <option value="up" selected data-i18n="optUp"></option>
          <option value="down" data-i18n="optDown"></option>
          <option value="any" data-i18n="optAny"></option>
        </select>
        <div class="row2">
          <div><label for="rmin" data-i18n="rmin"></label><input id="rmin" type="number" min="1" max="9" value="1"></div>
          <div><label for="rmax" data-i18n="rmax"></label><input id="rmax" type="number" min="1" max="9" value="4"></div>
        </div>
        <label for="pstay"><span data-i18n="pstay"></span> <b id="pstayv">2 %</b></label>
        <input id="pstay" type="range" min="0" max="30" value="2">
        <label for="pwild"><span data-i18n="pwild"></span> <b id="pwildv">0 %</b></label>
        <input id="pwild" type="range" min="0" max="30" value="0">
        <div class="hint" data-i18n="perDay"></div>
      </details>
    </div>

    <div class="main">
      <!-- Lock -->
      <div class="card">
        <div class="lockzone">
          <div class="shackle" id="shackle"></div>
          <div class="body" id="wheels"></div>
          <div class="daylabel" id="daylabel"></div>
          <div class="truecode" id="truecode"></div>
        </div>
        <div class="alert" id="alert"></div>
      </div>

      <!-- Ranked codes -->
      <div class="card">
        <h2 data-i18n="rankH"></h2>
        <p class="hint" style="margin-top:0" data-i18n="rankHint"></p>
        <div id="inf"></div>
      </div>

      <!-- Evolution -->
      <div class="card">
        <h2 data-i18n="evoH"></h2>
        <p class="hint" style="margin-top:0" data-i18n="evoHint"></p>
        <div class="freq" id="freq"></div>
        <div class="legend">
          <span><i style="background:var(--accent);opacity:.45"></i><span data-i18n="lgShown"></span></span>
          <span><i style="background:var(--ok);opacity:.85"></i><span data-i18n="lgProb"></span></span>
          <span><i style="background:var(--accent-soft)"></i><span data-i18n="lgTop"></span></span>
          <span><i style="border:2px solid var(--ok)"></i><span data-i18n="lgTrue"></span></span>
        </div>
        <h3 style="margin-top:18px" data-i18n="confH"></h3>
        <canvas id="conf" style="height:160px"></canvas>
        <div class="hint" data-i18n="confHint"></div>
      </div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const I18N = {
  fr: {
    docTitle: 'Simulateur de cadenas',
    title: 'Le cadenas qu’on referme toujours pareil',
    lead: 'Chaque jour le propriétaire ouvre le cadenas (donc met le bon code), puis le referme en tournant les roues. Vous ne voyez que les chiffres affichés une fois fermé, et vous ne savez rien de ses habitudes. Le simulateur les tire au hasard en coulisses, puis devine le code à partir des seuls relevés.',
    start: '▶ Démarrer', stop: '■ Arrêter', reveal: 'Dévoiler le code', hide: 'Cacher le code', newCode: 'Nouveau code',
    speed: 'Vitesse :', digits: 'Nombre de chiffres',
    backstage: 'Coulisses : ce que fait vraiment le propriétaire (vous ne le savez pas)',
    mystery: 'Habitude tirée au hasard à chaque nouveau code', rdir: 'Sens de rotation',
    optUp: 'Toujours vers le haut (+)', optDown: 'Toujours vers le bas (−)', optAny: 'Au hasard, dans les deux sens',
    rmin: 'Crans min', rmax: 'Crans max',
    pstay: 'Retombe sur le bon chiffre (tour complet, oubli) :', pwild: 'Rotation hors habitude (n’importe combien de crans) :',
    perDay: 'Probabilités par roue et par jour.',
    rankH: 'Codes les plus probables',
    rankHint: 'Tous les codes classés selon leur probabilité d’être le bon, d’après les seuls relevés. Après « Dévoiler le code », le vrai code est surligné en vert.',
    evoH: 'Évolution jour après jour',
    evoHint: 'Même échelle de 0 à 100 % (trait du milieu = 50 %). Barre bleue : part des jours où le chiffre est affiché. Barre verte, par-dessus : probabilité que ce soit le bon chiffre. Les chiffres sous chaque roue donnent les deux valeurs, dans les mêmes couleurs.',
    lgShown: 'chiffres affichés', lgProb: 'probabilité d’être le bon chiffre', lgTop: 'chiffre le plus probable', lgTrue: 'vrai chiffre (après « Dévoiler »)',
    confH: 'Confiance dans le code le plus probable',
    confHint: 'Probabilité du code en tête, jour après jour. Après « Dévoiler » : vert quand ce code est le bon, rouge sinon.',
    click1: 'cran', clicks: 'crans', range: (a, b) => `${a} à ${b} crans`,
    up: 'vers le haut', down: 'vers le bas', both: 'dans les deux sens', ifTurns: 'si elle tourne ',
    habit: (d, r, p0, pw) => `${d}, ${r}, ${p0} % de tours complets, ${pw} % de gestes inhabituels`,
    day0: 'Jour 0 : pas encore d’observation', dayN: (n, c) => `Jour ${n} : cadenas fermé sur ${c}`,
    trueCode: 'Vrai code :',
    found: (n, c, p, h) => `Code trouvé au jour ${n} : ${c} (${p}), habitude « ${h} »`,
    good: ' : c’est le bon.', bad: ' : ce n’est pas le bon.', autoStop: ' Arrêt automatique à 99 % (Démarrer pour continuer).',
    running: (c, p) => `En cours : code le plus probable ${c} (${p}). Il faut encore des relevés pour en être sûr.`,
    emptyRank: 'Démarrez la simulation : les codes candidats apparaîtront ici, classés par probabilité.',
    tag: 'VRAI CODE', notTop: 'pas encore dans le haut du classement', realHabit: 'Habitude réelle (coulisses) :',
    wheel: 'Roue', shownPct: 'Chiffres affichés (% des jours)', probPct: 'Probabilité d’être le bon chiffre (%)',
    mostLikely: 'Le plus probable :', noObs: 'Pas encore de relevé.',
    perSec: (d, many) => `${d} jour${many ? 's' : ''} par seconde`, pctSep: ' '
  },
  en: {
    docTitle: 'Lock code simulator',
    title: 'The lock that’s always closed the same way',
    lead: 'Every day the owner opens the lock (so sets the right code), then closes it by turning the wheels. You only see the digits shown once it’s closed, and you know nothing about the owner’s habits. The simulator picks them at random backstage, then guesses the code from the observations alone.',
    start: '▶ Start', stop: '■ Stop', reveal: 'Reveal code', hide: 'Hide code', newCode: 'New code',
    speed: 'Speed:', digits: 'Number of digits',
    backstage: 'Backstage: what the owner really does (you don’t know this)',
    mystery: 'Random habit for each new code', rdir: 'Turning direction',
    optUp: 'Always up (+)', optDown: 'Always down (−)', optAny: 'Random, both ways',
    rmin: 'Min clicks', rmax: 'Max clicks',
    pstay: 'Lands back on the right digit (full turn, forgot):', pwild: 'Unusual turn (any number of clicks):',
    perDay: 'Probabilities per wheel and per day.',
    rankH: 'Most likely codes',
    rankHint: 'All codes ranked by their probability of being right, from the observations alone. After “Reveal code”, the true code is highlighted in green.',
    evoH: 'Day by day',
    evoHint: 'Same 0–100% scale (middle line = 50%). Blue bar: share of days the digit is shown. Green bar, on top: probability that it is the right digit. The numbers under each wheel give both values, in the same colours.',
    lgShown: 'digits shown', lgProb: 'probability of being the right digit', lgTop: 'most likely digit', lgTrue: 'true digit (after “Reveal”)',
    confH: 'Confidence in the most likely code',
    confHint: 'Probability of the leading code, day by day. After “Reveal”: green when that code is right, red otherwise.',
    click1: 'click', clicks: 'clicks', range: (a, b) => `${a} to ${b} clicks`,
    up: 'upwards', down: 'downwards', both: 'both ways', ifTurns: 'if turned ',
    habit: (d, r, p0, pw) => `${d}, ${r}, ${p0}% full turns, ${pw}% unusual turns`,
    day0: 'Day 0: no observation yet', dayN: (n, c) => `Day ${n}: lock closed on ${c}`,
    trueCode: 'True code:',
    found: (n, c, p, h) => `Code found on day ${n}: ${c} (${p}), habit “${h}”`,
    good: ': correct.', bad: ': wrong.', autoStop: ' Stopped automatically at 99% (press Start to continue).',
    running: (c, p) => `In progress: most likely code ${c} (${p}). More observations are needed to be sure.`,
    emptyRank: 'Start the simulation: candidate codes will appear here, ranked by probability.',
    tag: 'TRUE CODE', notTop: 'not yet near the top', realHabit: 'Real habit (backstage):',
    wheel: 'Wheel', shownPct: 'Digits shown (% of days)', probPct: 'Probability of being the right digit (%)',
    mostLikely: 'Most likely:', noObs: 'No observation yet.',
    perSec: (d, many) => `${d} day${many ? 's' : ''} per second`, pctSep: ''
  }
};
let LANG = (() => {
  const q = new URLSearchParams(location.search).get('lang');
  if (q === 'fr' || q === 'en') return q;
  try { const v = localStorage.getItem('cadenas-lang'); if (v === 'fr' || v === 'en') return v; } catch (e) {}
  return (navigator.language || 'fr').toLowerCase().startsWith('fr') ? 'fr' : 'en';
})();
const T = () => I18N[LANG];
const fmt = x => x.toLocaleString(LANG === 'fr' ? 'fr-FR' : 'en-US');
const dec = s => LANG === 'fr' ? String(s).replace('.', ',') : String(s);
function applyLang() {
  document.documentElement.lang = LANG;
  document.title = T().docTitle;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = T()[el.dataset.i18n]; });
  document.querySelectorAll('[data-lang]').forEach(b => b.classList.toggle('on', b.dataset.lang === LANG));
  $('auto').textContent = timer ? T().stop : T().start;
  $('reveal').textContent = revealed ? T().hide : T().reveal;
}

let S, timer = null, revealed = false;

function clamp(v) { return Math.min(9, Math.max(1, Math.round(v) || 1)); }
function cfg() {
  let rmin = clamp(+$('rmin').value), rmax = clamp(+$('rmax').value);
  if (rmin > rmax) [rmin, rmax] = [rmax, rmin];
  return { n: +$('n').value, rdir: $('rdir').value, rmin, rmax, pstay: +$('pstay').value / 100, pwild: +$('pwild').value / 100 };
}

// What the owner really does (hidden): offset k such that shown digit = code + k (mod 10)
function realOffset(c) {
  const r = Math.random();
  if (r < c.pstay) return 0;                      // full turn / forgot: lands on the right digit
  if (r < c.pstay + c.pwild) return rnd(1, 9);    // unusual gesture
  const k = rnd(c.rmin, c.rmax);
  const dir = c.rdir === 'up' ? 1 : c.rdir === 'down' ? -1 : (Math.random() < .5 ? 1 : -1);
  return (10 + dir * k) % 10;
}

const emptyFreq = n => Array.from({ length: n }, () => Array(10).fill(0));
const EPS = 0.03, LAMBDA = 0.7;
const crans = (a, b) => a === b ? `${a} ${a > 1 ? T().clicks : T().click1}` : T().range(a, b);
const fmtCode = c => c.length > 6 ? c.join('') : c.join(' ');
const STOP_AT = 0.99;
const pctTxt = p => (p >= .995 ? '> 99' : p < .01 ? '< 1' : Math.floor(p * 100)) + T().pctSep + '%';

// Every habit the owner could have: a contiguous range of offsets (one direction), or both directions
const BEHAV = (() => {
  const B = [];
  for (let lo = 1; lo <= 9; lo++) for (let hi = lo; hi <= 9; hi++) {
    const ks = [];
    for (let k = lo; k <= hi; k++) ks.push(k);
    const up = hi, down = 10 - lo;
    B.push({ ks, turn: Math.min(up, down), label: () => up <= down ? `${T().up}, ${crans(lo, hi)}` : `${T().down}, ${crans(10 - hi, 10 - lo)}` });
  }
  // both directions, lo..hi clicks (wider ranges are already contiguous intervals above)
  for (let lo = 1; lo <= 4; lo++) for (let hi = lo; hi <= 4; hi++) {
    const ks = [];
    for (let k = lo; k <= hi; k++) ks.push(k, 10 - k);
    B.push({ ks, turn: hi, label: () => `${T().both}, ${crans(lo, hi)}` });
  }
  return B;
})();

// For each habit, fit a 3-part offset model by maximum likelihood: uniform inside the habit range,
// a separate (rare) mass on offset 0 (full turn / forgot = the code itself), uniform elsewhere.
// That offset-0 bump is what tells apart habits that are shifted copies of each other.
// Returns candidate codes sorted by probability (mixture over habits), plus per-wheel digit probabilities.
function infer(freq, N) {
  const n = freq.length, M = N * n, res = [];
  for (const b of BEHAV) {
    const K = b.ks.length;
    let Tin = 0, Z0 = 0;
    for (let i = 0; i < n; i++) {
      let best = -1, bz = -1;
      for (let c = 0; c < 10; c++) {
        let t = 0;
        for (const k of b.ks) t += freq[i][(c + k) % 10];
        const z = freq[i][c];
        if (t > best || (t === best && z > bz)) { best = t; bz = z; }
      }
      Tin += best; Z0 += bz;
    }
    const R = M - Tin - Z0;
    let pin = (Tin + .5) / (M + 1.5), p0 = (Z0 + .5) / (M + 1.5), po = (R + .5) / (M + 1.5);
    if (p0 > 0.1) { const f = 0.9 / (pin + po); p0 = 0.1; pin *= f; po *= f; } // landing on the code stays rare
    const la = Math.log(pin / K), l0 = Math.log(p0), lo = K < 9 ? Math.log(po / (9 - K)) : 0;
    const post = [];
    for (let i = 0; i < n; i++) {
      const l = [];
      let m = -Infinity;
      for (let c = 0; c < 10; c++) {
        let t = 0;
        for (const k of b.ks) t += freq[i][(c + k) % 10];
        const z = freq[i][c], v = t * la + z * l0 + (N - t - z) * lo;
        l.push(v);
        if (v > m) m = v;
      }
      let sum = 0;
      const e = l.map(v => { const x = Math.exp(v - m); sum += x; return x; });
      post.push(e.map(x => x / sum));
    }
    res.push({ ll: Tin * la + Z0 * l0 + R * lo - LAMBDA * b.turn, b, post });
  }
  const mx = Math.max(...res.map(r => r.ll));
  let Z = 0;
  res.forEach(r => { r.w = Math.exp(r.ll - mx); Z += r.w; });
  const marg = emptyFreq(n);
  for (const r of res) for (let i = 0; i < n; i++) for (let c = 0; c < 10; c++) marg[i][c] += r.w / Z * r.post[i][c];
  // Candidate codes: the most likely digits of each wheel, then the exact probability of each combination
  const act = res.filter(r => r.w / Z > 1e-6);
  // Candidate codes: beam search on the per-wheel digit probabilities (keeps the 200 best partial codes),
  // then the exact probability of each candidate
  let beam = [{ code: [], s: 1 }];
  for (const m of marg) {
    const idx = [...Array(10).keys()].sort((a, b) => m[b] - m[a]).filter((d, k) => k === 0 || (k < 5 && m[d] >= 0.001));
    const nx = [];
    for (const b of beam) for (const d of idx) nx.push({ code: [...b.code, d], s: b.s * m[d] });
    nx.sort((a, b) => b.s - a.s);
    beam = nx.slice(0, 200);
  }
  const combos = beam.map(b => b.code);
  const out = combos.map(code => {
    let pr = 0, bw = -1, bb = act[0].b;
    for (const r of act) {
      let q = r.w / Z;
      for (let i = 0; i < n; i++) q *= r.post[i][code[i]];
      pr += q;
      if (q > bw) { bw = q; bb = r.b; }
    }
    return { key: code.join(''), code, p: pr, b: bb };
  }).sort((a, b) => b.p - a.p);
  out.marg = marg; out.act = act; out.Z = Z;
  return out;
}
// Exact probability of any code (for the true code when it is not among the candidates)
function codeProb(inf, code) {
  let pr = 0;
  for (const r of inf.act) { let q = r.w / inf.Z; code.forEach((c, i) => { q *= r.post[i][c]; }); pr += q; }
  return pr;
}

function syncLabels() { $('pstayv').textContent = $('pstay').value + T().pctSep + '%'; $('pwildv').textContent = $('pwild').value + T().pctSep + '%'; }
function randomBehaviour() {
  const r = Math.random();
  $('rdir').value = r < .42 ? 'up' : r < .84 ? 'down' : 'any';
  const mn = rnd(1, 2);
  $('rmin').value = mn;
  $('rmax').value = Math.min(9, mn + rnd(1, 4));
  $('pstay').value = rnd(0, 4);
  $('pwild').value = rnd(0, 2);
  syncLabels();
}
function behaviourText(c) {
  const d = c.rdir === 'up' ? T().up : c.rdir === 'down' ? T().down : T().both;
  return T().habit(d, crans(c.rmin, c.rmax), Math.round(c.pstay * 100), Math.round(c.pwild * 100));
}

function newGame() {
  stopAuto();
  const n = +$('n').value;
  revealed = false;
  if ($('mystery').checked) { randomBehaviour(); $('backstage').open = false; }
  S = {
    n,
    code: Array.from({ length: n }, () => rnd(0, 9)),
    shown: Array.from({ length: n }, () => rnd(0, 9)),
    days: 0, freq: emptyFreq(n), inf: infer(emptyFreq(n), 0), conf: []
  };
  $('reveal').textContent = T().reveal;
  document.documentElement.style.setProperty('--n', n);
  document.documentElement.classList.toggle('many', n > 6);
  renderWheels(false);
  render();
}

function step() {
  const c = cfg();
  const sh = $('shackle');
  sh.classList.add('open');
  setTimeout(() => sh.classList.remove('open'), 300);
  const d = S.code.map(ci => (ci + realOffset(c)) % 10);
  S.days++;
  S.shown = d;
  d.forEach((x, i) => S.freq[i][x]++);
  S.inf = infer(S.freq, S.days);
  S.conf.push({ p: S.inf[0].p, key: S.inf[0].key });
  renderWheels(true);
  render();
  // Stop once the leading code reaches 99 % (only the first time: pressing Démarrer again keeps going)
  if (S.inf[0].p >= STOP_AT && !S.autoStopped) { S.autoStopped = true; stopAuto(); render(); }
}

function renderWheels(anim) {
  const w = $('wheels');
  w.innerHTML = '';
  S.shown.forEach(d => {
    const el = document.createElement('div');
    el.className = 'wheel' + (anim ? ' bump' : '');
    el.innerHTML = `<span>${(d + 9) % 10}</span><span class="cur">${d}</span><span>${(d + 1) % 10}</span>`;
    w.appendChild(el);
  });
}

function render() {
  const days = S.days;
  $('daylabel').textContent = days ? T().dayN(days, fmtCode(S.shown)) : T().day0;
  const tc = $('truecode');
  tc.className = 'truecode' + (revealed ? ' on' : '');
  tc.innerHTML = T().trueCode + ' <b>' + fmtCode(revealed ? S.code : S.code.map(() => '?')) + '</b>';

  const al = $('alert');
  if (!days) al.className = 'alert';
  else {
    const t = S.inf[0], good = t.key === S.code.join('');
    if (t.p >= STOP_AT) {
      al.className = 'alert ' + (revealed && !good ? 'bad' : 'ok') + ' show';
      al.textContent = T().found(days, fmtCode(t.code), pctTxt(t.p), t.b.label()) + (revealed ? (good ? T().good : T().bad) : '.') + (timer ? '' : T().autoStop);
    } else {
      al.className = 'alert info show';
      al.textContent = T().running(fmtCode(t.code), pctTxt(t.p));
    }
  }
  renderInf();
  renderFreq();
}

function renderInf() {
  const box = $('inf');
  if (!S.days) { box.innerHTML = `<p class="hint">${T().emptyRank}</p>`; return; }
  const truth = S.code.join(''), top = S.inf.slice(0, 10);
  const row = (n, g, p, ok, label) => `<div class="rrow${ok ? ' truth' : ''}"><span class="rn">${n}</span><span class="rc">${fmtCode(g)}</span><span class="rbar"><i style="width:${Math.max(.6, p * 100)}%"></i></span><span class="rp">${pctTxt(p)}</span><span class="rl">${ok ? `<b class="tag">${T().tag}</b> ` : ''}${label}</span></div>`;
  let h = `<div class="rank" style="--cw:${S.n > 6 ? S.n + 1 : S.n * 2 + 1}ch">`;
  top.forEach((g, i) => { h += row(i + 1, g.code, g.p, revealed && g.key === truth, T().ifTurns + g.b.label()); });
  if (revealed && !top.some(g => g.key === truth)) {
    const idx = S.inf.findIndex(g => g.key === truth);
    h += row(idx < 0 ? '…' : idx + 1, S.code, codeProb(S.inf, S.code), true, T().notTop);
  }
  h += '</div>';
  if (revealed) h += `<p class="hint">${T().realHabit} <b>${behaviourText(cfg())}</b>.</p>`;
  box.innerHTML = h;
}

function renderFreq() {
  const days = S.days, box = $('freq'), marg = S.inf.marg;
  const pct = x => dec((x * 100).toFixed(x < .1 ? 1 : 0));
  box.innerHTML = '';
  S.freq.forEach((f, i) => {
    const max = Math.max(1, ...f);
    const pm = marg[i];
    const top = pm.indexOf(Math.max(...pm));
    const el = document.createElement('div');
    el.className = 'fw';
    // One chart per wheel, same 0-100 % scale: blue = share of days the digit is shown, green (on top) = probability it is the code
    el.innerHTML = `<h4>${T().wheel} ${i + 1}</h4>
      <div class="duo">${f.map((x, d) => `<div class="col" title="${d} · ${T().lgShown} ${days ? pct(x / days) : 0} % · ${T().lgProb} ${days ? pct(pm[d]) : 0} %"><i class="b" style="height:${days ? x / days * 100 : 0}%"></i><i class="g" style="height:${days ? pm[d] * 100 : 0}%"></i></div>`).join('')}</div>
      <div class="blabels">${f.map((x, d) => `<span class="${days && d === top ? 'best' : ''} ${revealed && S.code[i] === d ? 'truth' : ''}">${d}</span>`).join('')}</div>
      <div class="bpct blue">${f.map(x => `<span>${days ? pct(x / days) : ''}</span>`).join('')}</div>
      <div class="bpct green">${pm.map(x => `<span>${days ? pct(x) : ''}</span>`).join('')}</div>
      <div class="est">${days ? `${T().mostLikely} <b>${top}</b> (${pctTxt(pm[top])})` : T().noObs}</div>`;
    box.appendChild(el);
  });
  drawConf();
}

function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

function drawConf() {
  const cv = $('conf'), dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  const x = cv.getContext('2d');
  x.scale(dpr, dpr);
  x.clearRect(0, 0, W, H);
  const pad = { l: 40, r: 12, t: 8, b: 22 };
  const pw = W - pad.l - pad.r, ph = H - pad.t - pad.b;
  const len = S.conf.length, maxD = Math.max(10, len);
  const xOf = d => pad.l + pw * d / maxD, yOf = p => pad.t + ph * (1 - p);
  x.font = '11px system-ui'; x.fillStyle = css('--muted'); x.strokeStyle = css('--line'); x.lineWidth = 1;
  [0, .5, 1].forEach(p => {
    x.beginPath(); x.moveTo(pad.l, yOf(p)); x.lineTo(W - pad.r, yOf(p)); x.stroke();
    x.textAlign = 'right'; x.fillText(Math.round(p * 100) + ' %', pad.l - 6, yOf(p) + 4);
  });
  x.textAlign = 'center';
  const stepX = Math.ceil(maxD / 8);
  for (let d = 0; d <= maxD; d += stepX) x.fillText(fmt(d), xOf(d), H - 6);
  if (!len) return;
  const truth = S.code.join(''), every = Math.max(1, Math.floor(len / pw));
  const col = e => !revealed ? css('--accent') : e.key === truth ? css('--ok') : css('--bad');
  x.lineWidth = 2.5;
  let prev = null;
  for (let j = 0; j < len; j += every) {
    const e = S.conf[j], px = xOf(j + 1), py = yOf(e.p);
    if (prev) { x.strokeStyle = col(e); x.beginPath(); x.moveTo(prev[0], prev[1]); x.lineTo(px, py); x.stroke(); }
    prev = [px, py];
  }
  const last = S.conf[len - 1];
  x.fillStyle = col(last); x.beginPath(); x.arc(xOf(len), yOf(last.p), 4, 0, 7); x.fill();
}

const DELAYS = [1000, 600, 400, 250, 150, 90, 50, 25, 10, 4];
function syncSpeed() {
  const d = 1000 / DELAYS[$('speed').value - 1];
  $('speedv').textContent = T().perSec(d < 10 ? dec(d.toFixed(d < 2 ? 1 : 0)) : Math.round(d), d >= 2);
}
function stopAuto() { if (timer) clearInterval(timer); timer = null; $('auto').textContent = T().start; }
function startAuto() {
  stopAuto();
  timer = setInterval(step, DELAYS[$('speed').value - 1]);
  $('auto').textContent = T().stop;
}

$('reset').onclick = newGame;
$('n').onchange = newGame;
$('auto').onclick = () => timer ? stopAuto() : startAuto();
$('speed').oninput = () => { syncSpeed(); if (timer) startAuto(); };
$('reveal').onclick = () => { revealed = !revealed; $('reveal').textContent = revealed ? T().hide : T().reveal; render(); };
$('pstay').oninput = syncLabels;
$('pwild').oninput = syncLabels;
window.addEventListener('resize', drawConf);
if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', drawConf);

document.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => {
  LANG = b.dataset.lang;
  try { localStorage.setItem('cadenas-lang', LANG); } catch (e) {}
  applyLang(); syncLabels(); syncSpeed(); render();
});
applyLang();
syncSpeed();
newGame();
</script>
